[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "harp-gx-core"
version = "1.3.0.dev0"
description = "Rust-Rechenkern (g²/g³/g⁴) für ExSE Harp GX Mobil – optional, sonst Numba/NumPy"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: Implementation :: CPython"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "harp_gx_core"
