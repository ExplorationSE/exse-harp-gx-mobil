<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ExSE Harp GX Mobil</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/vendor/uPlot.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span id="conn" class="dot off" title="Verbindung"></span><b>Harp GX Mobil</b><small>Harp · Simulation</small></div>
  <div class="state"><span id="runstate" class="pill">–</span>
    <button id="ctrlBtn" class="pill btn-ctrl" title="Steuerung übernehmen/abgeben">Steuerung übernehmen</button></div>
</header>

<main>
  <section class="card hist-card">
    <div class="card-head">
      <button id="viewBtn" class="viewbtn" type="button" title="Ansicht wechseln: Histogramm / g² / g³ / g⁴ / Zeitverlauf" aria-label="Ansicht wechseln">
        <span data-v="hist" class="on"><em class="lg">Histogramm</em><em class="sh">Histo</em></span><span data-v="corr"><em class="lg"><span class="gx">g<sup>2</sup></span></em><em class="sh"><span class="gx">g<sup>2</sup></span></em></span><span data-v="g3"><em class="lg"><span class="gx">g<sup>3</sup></span></em><em class="sh"><span class="gx">g<sup>3</sup></span></em></span><span data-v="g4"><em class="lg"><span class="gx">g<sup>4</sup></span></em><em class="sh"><span class="gx">g<sup>4</sup></span></em></span><span data-v="trace"><em class="lg">Zeitverlauf</em><em class="sh">Zeit</em></span><i aria-hidden="true">⇄</i></button>
      <div id="chanbox" class="chanbox" role="group" aria-label="Kanäle ein-/ausblenden"></div>
    </div>
    <div class="chartwrap">
      <div id="histPlot" class="plot"></div>
      <div id="tracePlot" class="plot" hidden></div>
      <div id="corrPlot" class="plot" hidden></div>
      <div id="gnPlot" class="plot" hidden><canvas id="gnCanvas"></canvas><div id="gnCut"></div></div>
      <div id="chartHint" class="charthint" hidden></div>
    </div>
    <div id="readout" class="readout">&nbsp;</div>
    <div id="gnSliderRow" class="gnslider" hidden><label class="sl">τ₃ <input id="gnTau3" type="range" min="0" max="31" step="1"><output id="gnTau3v"></output></label></div>
    <div id="gnbar" class="gnbar" hidden>
      <div class="gnrow">
        <select id="gnCombo" aria-label="Kanal-Kombination"></select>
        <div id="gnMode" class="seg" role="group" aria-label="Darstellung"></div>
      </div>
      <div class="gnrow gntiles">
        <div id="gnBig" class="gnbig"><div class="k">g(0)</div><div class="v">–</div><div class="e"></div></div>
        <div id="gnList" class="gnlist"></div>
      </div>
      <div id="gnNotes" class="gnnotes"></div>
    </div>
  </section>




  <section class="card" id="controls">
    <div class="card-head"><h2>Steuerung</h2><span id="lockinfo" class="muted"></span></div>
    <div class="btnrow">
      <button id="bStart" class="b primary">▶ Start</button>
      <button id="bStop" class="b">■ Stopp</button>
      <button id="bReset" class="b">⟲ Reset</button>
      <button id="bRewind" class="b">⏮ Von vorn</button>
    </div>
    <div id="progress" class="progress" title="Wiedergabe-Fortschritt der Datei"><div></div></div>
    <div class="grid">
      <label>PTU-Datei<select id="file"></select></label>
      <label>Frame-Intervall<select id="refresh_ms">
        <option value="100">100 ms (10 Hz)</option><option value="150">150 ms (≈7 Hz)</option>
        <option value="200">200 ms (5 Hz)</option><option value="500">500 ms</option>
        <option value="1000">1 s</option><option value="2000">2 s</option></select></label>
      <label>Wiedergabe-Tempo<select id="speed">
        <option value="0.1">0,1×</option><option value="0.25">0,25×</option><option value="0.5">0,5×</option>
        <option value="1" selected>Echtzeit</option><option value="2">2×</option><option value="5">5×</option>
        <option value="10">10×</option><option value="20">20×</option><option value="50">50×</option><option value="100">100×</option></select></label>
      <label>Binbreite<select id="binning"></select></label>
      <label>Histogrammlänge<select id="hist_len_code"></select></label>
      <label>Modus<select id="mode"><option value="accumulate">Akkumulieren</option><option value="sliding">Gleitendes Fenster</option></select></label>
      <label>Fenster (Frames)<input id="window_frames" type="number" min="2" max="300" step="1"></label>
      <label>Anzeige-Punkte<select id="display_points">
        <option>128</option><option>256</option><option>512</option><option>1024</option><option>2048</option><option>4096</option></select></label>
      <label>Referenzkanal (<span class="gx">g<sup>2</sup></span>)<select id="ref_channel"></select></label>
      <label>Binbreite <span class="gx">g<sup>2</sup></span><select id="corr_binning"></select></label>
      <label>Bereich <span class="gx">g<sup>3</sup></span>/<span class="gx">g<sup>4</sup></span> (±)<select id="gn_range_ps"></select></label>
      <label>Koinzidenzfenster g(0)<select id="gn_win_ps"></select></label>
      <label class="chk"><input id="loop" type="checkbox"> Datei wiederholen</label>
      <button id="bRecal" class="b" type="button" title="Kabel-Laufzeiten aus den g²-Kurven neu bestimmen">Laufzeiten kalibrieren</button>
    </div>
  </section>

  <section class="card" id="ratesCard">
    <div class="card-head"><h2>Zählraten <span class="muted">cps</span></h2><span id="accinfo" class="muted"></span></div>
    <div id="rates" class="rates"></div>
  </section>

  <section class="card info">
    <dl id="infolist"></dl>
    <p class="appver"><span id="appver">ExSE Harp GX Mobil</span> <span class="simbadge" title="Daten aus PTU-Dateien, kein echtes Gerät">Simulation</span></p>
    <p class="disclaimer">Simulation mit synthetischen PTU-Dateien – diese Version enthält noch keine Schnittstelle zu einem echten Harp.</p>
  </section>
</main>
<div id="connbar" class="connbar" hidden>Verbindung wird wiederhergestellt …</div>
<div id="toast" class="toast"></div>
<script src="/static/vendor/uPlot.iife.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
